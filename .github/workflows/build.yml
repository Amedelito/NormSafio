name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plugin:
    name: Compilar plugin (Paper 1.21.1 · Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven package
        run: mvn -B -ntp clean package

      - uses: actions/upload-artifact@v4
        with:
          name: Dedsafio-plugin
          path: target/Dedsafio-*.jar
          if-no-files-found: error

  pack:
    name: Generar resource pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar texturas y modelos
        run: |
          pip install pillow
          python tools/generate_pack.py

      - name: Validar JSON y texturas
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path("resourcepack")
          for p in root.rglob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))
          for p in root.rglob("*.mcmeta"):
              json.loads(p.read_text(encoding="utf-8"))
          for m in (root / "assets/minecraft/models/item").glob("*.json"):
              for o in json.loads(m.read_text(encoding="utf-8")).get("overrides", []):
                  name = o["model"].split(":")[1].split("/")[-1]
                  assert (root / f"assets/dedsafio/textures/item/{name}.png").exists(), name
          print("Pack válido")
          PY

      - name: Empaquetar y calcular SHA-1
        run: |
          cd resourcepack
          zip -r -X -9 ../Dedsafio-pack.zip .
          cd ..
          sha1sum Dedsafio-pack.zip | cut -d' ' -f1 > Dedsafio-pack.sha1
          echo "SHA-1 del pack: $(cat Dedsafio-pack.sha1)"

      - uses: actions/upload-artifact@v4
        with:
          name: Dedsafio-pack
          path: |
            Dedsafio-pack.zip
            Dedsafio-pack.sha1
          if-no-files-found: error

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plugin, pack]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Notas de la release
        run: |
          {
            echo "## Dedsafío ${GITHUB_REF_NAME}"
            echo
            echo "- **Dedsafio-*.jar** → copia a \`plugins/\` (Paper 1.21.1, Java 21)."
            echo "- **Dedsafio-pack.zip** → resource pack con las texturas."
            echo
            echo "SHA-1 del pack (ponlo en \`resource-pack.sha1\` del config.yml):"
            echo
            echo "\`$(cat dist/Dedsafio-pack.sha1)\`"
          } > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/Dedsafio-*.jar
            dist/Dedsafio-pack.zip
            dist/Dedsafio-pack.sha1
