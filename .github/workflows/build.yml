name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plugin:
    name: Compilar plugin (Paper 1.21.1 · Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Funciona aunque el proyecto esté dentro de una subcarpeta del repo.
      - name: Localizar proyecto
        id: loc
        run: |
          POM=$(find . -maxdepth 3 -name pom.xml -not -path './.git/*' | head -n1)
          if [ -z "$POM" ]; then
            echo "::error::No encuentro pom.xml en el repo. Sube el contenido de la carpeta Dedsafio (pom.xml, src, tools...) al repo."
            find . -maxdepth 3 -not -path './.git/*' | sort
            exit 1
          fi
          DIR=$(dirname "$POM")
          echo "Proyecto en: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven package
        working-directory: ${{ steps.loc.outputs.dir }}
        run: mvn -B -ntp clean package

      - uses: actions/upload-artifact@v7
        with:
          name: Dedsafio-plugin
          path: ${{ steps.loc.outputs.dir }}/target/Dedsafio-*.jar
          if-no-files-found: error

  pack:
    name: Generar resource pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Localizar generador
        id: loc
        run: |
          GEN=$(find . -maxdepth 4 -name generate_pack.py -not -path './.git/*' | head -n1)
          if [ -z "$GEN" ]; then
            echo "::error::No encuentro tools/generate_pack.py. Sube la carpeta tools al repo."
            find . -maxdepth 3 -not -path './.git/*' | sort
            exit 1
          fi
          DIR=$(dirname "$(dirname "$GEN")")
          echo "Proyecto en: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generar texturas y modelos
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          pip install pillow
          python tools/generate_pack.py

      - name: Validar JSON y texturas
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path("resourcepack")
          for p in list(root.rglob("*.json")) + list(root.rglob("*.mcmeta")):
              json.loads(p.read_text(encoding="utf-8"))
          n = 0
          for m in (root / "assets/minecraft/models/item").glob("*.json"):
              for o in json.loads(m.read_text(encoding="utf-8")).get("overrides", []):
                  name = o["model"].split(":")[1].split("/")[-1]
                  assert (root / f"assets/dedsafio/textures/item/{name}.png").exists(), name
                  assert (root / f"assets/dedsafio/models/item/{name}.json").exists(), name
                  n += 1
          print(f"Pack válido: {n} objetos con textura")
          PY

      - name: Empaquetar y calcular SHA-1
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          (cd resourcepack && zip -r -X -9 ../Dedsafio-pack.zip .)
          sha1sum Dedsafio-pack.zip | cut -d' ' -f1 > Dedsafio-pack.sha1
          echo "SHA-1 del pack: $(cat Dedsafio-pack.sha1)"
          echo "### SHA-1 del resource pack" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$(cat Dedsafio-pack.sha1)\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: Dedsafio-pack
          path: |
            ${{ steps.loc.outputs.dir }}/Dedsafio-pack.zip
            ${{ steps.loc.outputs.dir }}/Dedsafio-pack.sha1
          if-no-files-found: error

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plugin, pack]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Notas de la release
        run: |
          {
            echo "## Dedsafío ${GITHUB_REF_NAME}"
            echo
            echo "- **Dedsafio-*.jar** → copia a \`plugins/\` (Paper 1.21.1, Java 21)."
            echo "- **Dedsafio-pack.zip** → resource pack con las texturas."
            echo
            echo "SHA-1 del pack (ponlo en \`resource-pack.sha1\` del config.yml):"
            echo
            echo "\`$(cat dist/Dedsafio-pack.sha1)\`"
          } > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/Dedsafio-*.jar
            dist/Dedsafio-pack.zip
            dist/Dedsafio-pack.sha1
