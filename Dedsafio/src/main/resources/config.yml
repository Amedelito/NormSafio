# ───────── Dedsafío · configuración ─────────
lighthouse-radius: 12
rune-max-level: 5
portal-cooldown-seconds: 3

# Resource pack con las texturas (se genera en la release de GitHub: Dedsafio-pack.zip).
# Sube el zip a un enlace directo y pon aquí la URL y su SHA-1 (viene en las notas de la release).
resource-pack:
  enabled: true
  url: ""             # p. ej. https://github.com/TU_USUARIO/Dedsafio/releases/latest/download/Dedsafio-pack.zip
  sha1: ""            # 40 caracteres hex; permite que el cliente cachee el pack
  required: false
  prompt: "<gradient:#ff9a3c:#ffd166><bold>Dedsafío</bold></gradient> <gray>usa texturas propias."

challenge:
  waves: 8            # la última oleada es el jefe final
  wave-reward: 3      # deditas = wave-reward + nº de oleada
  boss-reward: 60

gulag:
  countdown: 15
  min-players: 2
  max-players: 12
  space-void-depth: 20
  race-time: 180
  win-reward: 40
  participation-reward: 5
  race-rewards: [40, 25, 15]

# Precio en deditas. Quita una línea (o pon 0) para sacar el objeto de la tienda.
shop:
  prices:
    dungeon_helmet: 20
    dungeon_chestplate: 32
    dungeon_leggings: 28
    dungeon_boots: 16
    earth_helmet: 28
    earth_chestplate: 44
    earth_leggings: 38
    earth_boots: 22
    dimensional_helmet: 60
    dimensional_chestplate: 96
    dimensional_leggings: 80
    dimensional_boots: 48
    ancestral_sword: 120
    belic_sword: 100
    celestial_sword: 180
    potion_vitality: 15
    potion_fury: 20
    potion_dimensional: 25
    potion_ancestral: 18
    soul_flower: 40
    resurrection_spoon: 250
    totem_eonic: 90
    totem_iron: 70
    totem_otter: 60
    totem_flashbang: 55
    rune_table: 80
    lighthouse: 90
    ancestral_block: 40
    statue: 35
    kart: 45
