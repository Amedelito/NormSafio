name: Dedsafio
version: '${project.version}'
main: es.dedsafio.Dedsafio
api-version: '1.21'
description: Objetos, mecánicas y gulags inspirados en Dedsafío.
authors: [DedsafioFan]
commands:
  dedsafio:
    description: Comando principal del plugin
    aliases: [ded]
  deditas:
    description: Economía de deditas
    aliases: [dedita, dd]
  tienda:
    description: Tienda de deditas
    aliases: [shop]
  reto:
    description: Retos por oleadas con jefe final
  portal:
    description: Portales entre zonas
  emote:
    description: Animaciones del jugador
    aliases: [emocion]
  gulag:
    description: Gulags (boxeo, espacio, carreras)
permissions:
  dedsafio.admin:
    description: Administración del plugin
    default: op
